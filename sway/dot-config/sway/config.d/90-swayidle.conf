# Idle and lock configuration using custom GNOME-style gtklock
#
# Bloqueia a tela após 300 segundos de inatividade, desliga os monitores após mais 60 segundos,
# e bloqueia antes de suspender/dormir (fechar tampa do notebook, suspend, etc.)
#
# Variáveis customizáveis em ~/.config/sway/config:
#   $lock_timeout    (padrão: 300 segundos = 5 minutos)
#   $screen_timeout  (padrão: 60 segundos após o bloqueio)
#   $suspend_timeout (opcional: tempo para suspender automaticamente em segundos)

set $lock_cmd ~/.config/sway/lock.sh

exec LT="$lock_timeout" ST="$screen_timeout" SLT="$suspend_timeout" LT=${LT:-300} ST=${ST:-60} && \
    swayidle -w \
        timeout $LT '$lock_cmd' \
        timeout $((LT + ST)) 'swaymsg "output * power off"' \
                      resume 'swaymsg "output * power on"' \
        timeout $ST 'pgrep -xu "$USER" gtklock >/dev/null && swaymsg "output * power off"' \
             resume 'pgrep -xu "$USER" gtklock >/dev/null && swaymsg "output * power on"' \
        ${SLT:+timeout $SLT 'systemctl suspend'} \
        before-sleep '$lock_cmd' \
        lock '$lock_cmd' \
        unlock 'pkill -xu "$USER" -SIGUSR1 gtklock || pkill -xu "$USER" -SIGUSR1 swaylock'
