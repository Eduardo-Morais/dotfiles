# Configuration file for foot terminal emulator
# Configured to match Ptyxis (Adwaita Dark + JetBrainsMono Nerd Font)

font=JetBrainsMono Nerd Font:size=12
pad=10x10
initial-window-size-chars=100x28

[cursor]
style=block
blink=yes
#color=1a1a1a 9fd5f6

[colors-dark]
background=000000
foreground=ffffff

## Normal colors
regular0=242424 # black
regular1=c01c28 # red
regular2=26a269 # green
regular3=a2734c # yellow
regular4=12488b # blue
regular5=a347ba # magenta
regular6=2aa1b3 # cyan
regular7=d0d0d0 # white

## Bright colors
bright0=5e5c64  # bright black
bright1=f66151  # bright red
bright2=33d17a  # bright green
bright3=e9ad0c  # bright yellow
bright4=2a7bde  # bright blue
bright5=c061cb  # bright magenta
bright6=33c7de  # bright cyan
bright7=ffffff  # bright white

## Selection colors
selection-foreground=ffffff
selection-background=3584e4

[mouse]
hide-when-typing=yes
